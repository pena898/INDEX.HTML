<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Lucky Draw Eksklusif</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Container Utama */
        .container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c2c2c 100%);
            border: 2px solid #ffd700;
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 15px rgba(255, 215, 0, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Badge Mewah */
        .luxury-badge {
            display: inline-block;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            border: 1px solid #ffd700;
            padding: 6px 15px;
            border-radius: 20px;
            background-color: rgba(255, 215, 0, 0.05);
        }

        h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #fff 0%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            font-weight: 800;
            line-height: 1.3;
        }
        
        p {
            font-size: 14px;
            color: #d1d1d1;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* Animasi Panah Mewah */
        .arrow-container {
            margin-bottom: 15px;
            animation: bounceArrow 1.5s infinite ease-in-out;
        }
        .arrow-down {
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }

        /* Tombol Emas Mewah */
        .btn-gold {
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            color: #1a1a1a;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            text-transform: uppercase;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }
        .btn-gold:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Tombol WhatsApp Mewah */
        .btn-wa-gold {
            background: linear-gradient(135deg, #1f4028 0%, #25d366 100%);
            color: #fff;
            border: 1px solid #25d366;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
            margin-top: 15px;
            text-transform: uppercase;
        }
        .btn-wa-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
        }

        /* Card Block Halaman 2 */
        .card-block-luxury {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Wheel Styling */
        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 20px auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            background: #111;
            border: 4px solid #ffd700;
        }
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #e74c3c;
            z-index: 20;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6));
        }

        #result-message {
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 15px;
            text-align: center;
            line-height: 1.5;
        }

        #claim-section {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        /* Utility Halaman */
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* Animasi Hujan Uang / Kilau */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            display: none;
            overflow: hidden;
        }
        .celebration-overlay.active {
            display: block;
        }
        .money-drop {
            position: absolute;
            top: -50px;
            font-size: 28px;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
        }
        .popup-win {
            animation: bounceIn 0.8s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Overlay Animasi Hujan Uang -->
    <div id="celebration" class="celebration-overlay"></div>

    <!-- HALAMAN 1: SELAMAT DATANG MEWAH -->
    <div id="page-1" class="page active container">
        <div class="luxury-badge">✨ Exclusive Event 2026 ✨</div>
        <h1>SELAMAT DATANG DI EVENT LUCKY DRAW BEACUKAI</h1>
        <p>Dapatkan kesempatan memiliki hadiah berupa emas , motor dan lain-lain.</p>
        
        <!-- Panah Bergerak Menunjuk ke Tombol Daftar -->
        <div class="arrow-container">
            <div class="arrow-down">▼</div>
        </div>

        <button class="btn-gold" onclick="goToPage2()">DAFTAR SEKARANG</button>
    </div>

    <!-- HALAMAN 2: RODA SPIN MEWAH -->
    <div id="page-2" class="page container">
        <div class="luxury-badge">✨ Lucky Wheel ✨</div>
        <h1>SPIN EKSKLUSIF</h1>
        
        <div class="card-block-luxury">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheel" width="400" height="400"></canvas>
            </div>
            
            <button class="btn-gold" id="spin-btn" onclick="startSpin()">🎯 Putar Roda Sekarang!</button>
            <div id="result-message"></div>
            
            <!-- Tombol Lanjut ke Admin -->
            <div id="claim-section">
                <a href="#" class="btn-wa-gold" id="wa-link" onclick="goToWhatsApp()">💬 Lanjut ke Admin</a>
            </div>
        </div>
    </div>

    <script>
        let wonPrize = "";
        const whatsappNumber = "62882001165502"; // Ubah nomor WhatsApp tujuan Anda di sini

        // Fungsi Pindah ke Halaman 2
        function goToPage2() {
            document.getElementById('page-1').classList.remove('active');
            document.getElementById('page-2').classList.add('active');
            drawWheel(); // Render ulang roda agar pas saat halaman ditampilkan
        }

        function goToWhatsApp() {
            const message = `Halo Admin, saya telah menyelesaikan spin Lucky Draw dan berhasil memenangkan hadiah *${wonPrize.toUpperCase()}*. Mohon bantuannya. Terima kasih! 🎉`;
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
        }

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        // Daftar Hadiah pada Roda dengan Nuansa Warna Mewah/Eksklusif
        const sectors = [
            { line1: "MOTOR", line2: "ADV150", bgColor: "#1b3b6f" },
            { line1: "EMAS ANTAM", line2: "27 GRAM", bgColor: "#2155cd" },
            { line1: "MOBIL FORTUNER", line2: "TAHUN 2026", bgColor: "#0b2545" },
            { line1: "UANG TUNAI", line2: "RP 50.000.000", bgColor: "#134074" },
            { line1: "EMAS ANTAM", line2: "50 GRAM", bgColor: "#8c6239" }
        ];

        const arc = (2 * Math.PI) / sectors.length;
        let startAngle = 0;

        function drawSector(sector, i) {
            const angle = startAngle + i * arc;
            ctx.save();
            
            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, angle, angle + arc, false);
            ctx.lineTo(200, 200);
            ctx.closePath();
            ctx.fillStyle = sector.bgColor;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, angle, angle + arc, false);
            ctx.lineTo(200, 200);
            ctx.strokeStyle = "#ffd700";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(200, 200);
            const midAngle = angle + arc / 2;
            ctx.rotate(midAngle);
            
            ctx.font = "bold 15px sans-serif";
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#000000"; 
            ctx.fillStyle = "#ffd700";    

            const isUpsideDown = midAngle > Math.PI / 2 && midAngle < 3 * Math.PI / 2;
            if (isUpsideDown) {
                ctx.rotate(Math.PI);
                ctx.textAlign = "left";
                ctx.strokeText(sector.line1, -165, -3);
                ctx.fillText(sector.line1, -165, -3);
                ctx.strokeText(sector.line2, -165, 14);
                ctx.fillText(sector.line2, -165, 14);
            } else {
                ctx.textAlign = "right";
                ctx.strokeText(sector.line1, 165, -3);
                ctx.fillText(sector.line1, 165, -3);
                ctx.strokeText(sector.line2, 165, 14);
                ctx.fillText(sector.line2, 165, 14);
            }

            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, 400, 400);
            for (let i = 0; i < sectors.length; i++) {
                drawSector(sectors[i], i);
            }
        }

        function startSpin() {
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('result-message').innerText = "Memutar...";
            
            // Dikunci agar selalu jatuh ke Emas Antam 50 Gram (Index ke-4)
            let targetIndex = 4; 
            wonPrize = sectors[targetIndex].line1 + " " + sectors[targetIndex].line2;

            let spins = 4; 
            let randomExtra = (Math.PI * 2) * spins;
            let targetAngle = (1.5 * Math.PI) - (targetIndex * arc + arc / 2);
            let finalAngle = randomExtra + targetAngle;

            let currentAngle = 0;
            let duration = 3000; 
            let startTime = null;

            function animateSpin(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;
                let percent = Math.min(progress / duration, 1);
                
                let easing = 1 - Math.pow(1 - percent, 3);
                currentAngle = easing * finalAngle;

                startAngle = currentAngle;
                drawWheel();

                if (percent < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    document.getElementById('result-message').innerHTML = `<div class="popup-win">🎉 SELAMAT! ANDA BERHASIL MENDAPATKAN: <br><span style="color: #ffd700; font-size: 18px;">${wonPrize.toUpperCase()}</span> 🥳</div>`;
                    document.getElementById('claim-section').style.display = 'block';
                    triggerCelebration();
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function triggerCelebration() {
            const celebrationContainer = document.getElementById('celebration');
            celebrationContainer.classList.add('active');
            
            const symbols = ['💵', '💶', '💷', '💴', '🧧', '✨', '🎉'];
            
            for (let i = 0; i < 50; i++) {
                const money = document.createElement('div');
                money.classList.add('money-drop');
                money.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                money.style.left = Math.random() * 100 + 'vw';
                money.style.animationDuration = (Math.random() * 2 + 2) + 's';
                money.style.animationDelay = (Math.random() * 2) + 's';
                celebrationContainer.appendChild(money);
            }
        }
    </script>
</body>
</html>
